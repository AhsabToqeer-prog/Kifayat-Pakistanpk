openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Kifayat Pakistan
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contacts
    description: Contact form submissions
  - name: campaigns
    description: Programs and campaigns
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contact submissions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, read, replied]
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
    post:
      operationId: submitContact
      tags: [contacts]
      summary: Submit a contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /contacts/{id}:
    patch:
      operationId: updateContactStatus
      tags: [contacts]
      summary: Update contact status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactStatusUpdate"
      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /stats:
    get:
      operationId: getStats
      tags: [contacts]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List all campaigns/programs
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Contact:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        subject:
          type: ["string", "null"]
        inquiryType:
          type: string
          enum: [general, volunteer, donation, resource, other]
        message:
          type: string
        status:
          type: string
          enum: [new, read, replied]
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - inquiryType
        - message
        - status
        - createdAt
    ContactInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        phone:
          type: string
        subject:
          type: string
        inquiryType:
          type: string
          enum: [general, volunteer, donation, resource, other]
        message:
          type: string
          minLength: 10
      required:
        - name
        - email
        - inquiryType
        - message
    ContactStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [new, read, replied]
      required:
        - status
    ContactList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        total:
          type: integer
      required:
        - items
        - total
    Stats:
      type: object
      properties:
        totalContacts:
          type: integer
        newContacts:
          type: integer
        activeCampaigns:
          type: integer
      required:
        - totalContacts
        - newContacts
        - activeCampaigns
    Campaign:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [active, completed, upcoming]
        beneficiaryCount:
          type: integer
        location:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
      required:
        - id
        - title
        - description
        - category
        - status
        - beneficiaryCount
